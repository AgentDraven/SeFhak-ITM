name: validate

on:
  push:
  pull_request:

jobs:
  itm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Check provider main tips and hosted integrity
        run: npm run providers:check -- --remote --hosted
      - name: Validate ITM consumer
        run: npm run verify && npm run e2e:playwright
